name: Build ByeDPI Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept Android licenses
      run: yes | sdkmanager --licenses
    
    - name: Install required SDK components
      run: |
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_FILE: debug.keystore
        KEYSTORE_PASSWORD: android
        KEY_ALIAS: androiddebugkey
        KEY_PASSWORD: android
    
    - name: Copy APKs to output directory
      run: |
        mkdir -p apk-output
        find app/build/outputs -name "*.apk" -type f -exec cp {} apk-output/ \;
        echo "APKs found:"
        ls -la apk-output/
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ByeDPI-Release-APK
        path: apk-output/*.apk
        if-no-files-found: error